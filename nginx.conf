# WebSocket settings
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# terron: РФ-соцсети-краулеры (VK/Mail.ru/Одноклассники) при шеринге главной должны
# получать РУССКИЙ OpenGraph. App-shell "/" кешируется (proxy_cache STATIC) БЕЗ учёта
# User-Agent → без этого кеш отдал бы один язык всем. Помечаем такие UA и байпасим
# кеш только для них (редкие запросы) — реальные юзеры и прочие краулеры (EN-дефолт)
# продолжают читать общий кеш. Ветвление языка — на бэкенде (RenderHtml.ogLangFromUA).
map $http_user_agent $og_ru_crawler {
    default 0;
    "~*vkshare|vkontakte|mail\.ru|odnoklassniki" 1;
}

# Cache configuration
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=1g;

# API cache for frequently requested endpoints
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=API_CACHE:10m inactive=60m max_size=100m;

server {
    listen 80 default_server;

    # Large cookie support
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 48k;
    proxy_buffers 4 32k;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # terron 30.08: CORS — тот же случай, что у /_assets/, и БЕЗ НЕГО ИГРА НЕ
        # ЗАПУСКАЕТСЯ ВОВСЕ. Здесь лежит `simworker.js`, то есть воркер симуляции:
        # на чужом хостинге он тянется cross-origin, браузер его резал, и матч
        # вис на «Загрузка карты» (поймано живой проверкой бандла).
        # ⚠️ Cross-origin воркер нельзя создать напрямую — WorkerClient штатно
        # уходит на blob-import, а тому как раз и нужен этот заголовок.
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        # terron 09.09: УСТАРЕВШИЙ ХЭШ → АКТУАЛЬНЫЙ ФАЙЛ, а не 404. Платформенные
        # сборки (хостинг GamePush, черновик Яндекса, GD) тянут ассеты с прода по
        # манифесту, вшитому в их бандл; каждый наш выкат словаря ломал их всем
        # разом (черновик Яндекса 09.09: словарь 404 → сырые ключи и плашка).
        # Node на промах отвечает 404 — перехватываем и уходим в @stale_asset,
        # где имя без хэша ведёт на ссылку «актуальная версия» (её кладёт сборка,
        # см. PublicAssetManifest.linkLatestPublicAsset).
        proxy_intercept_errors on;
        error_page 404 = @stale_asset;
        # Второй промах (имя без хэша тоже не нашлось) обязан снова пройти через
        # @stale_asset — иначе nginx отдаёт голый 404 node без CORS, и на чужом
        # хостинге это читается как «blocked by CORS policy», а не как 404.
        # Петли нет: без хэша rewrite не совпадает и срабатывает `return 404`.
        recursive_error_pages on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # terron 30.08: CORS на публичную статику. Нужен, когда бандл игры лежит
        # на ЧУЖОМ хостинге (Playgama и подобные): страница открыта с их домена,
        # а языки, атласы и карты тянутся fetch'ем с нашего — без заголовка
        # браузер режет запросы, и игра выходит с сырыми ключами вместо текста
        # (поймано живой проверкой сборки на стороннем origin).
        # ⚠️ Только статика и только чтение: кук здесь нет, отдавать её кому
        # угодно безопасно — ровно то, что делает любой CDN. API (api.terron.io)
        # это НЕ затрагивает: там сессионные куки, и звёздочка недопустима.
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # terron 09.09: см. комментарий в /_assets/. Хэш у публичных ассетов —
    # ровно 12 hex (PublicAssetManifest): `lang/ru.0f3d6c5eb913.json` →
    # `lang/ru.json`. После rewrite запрос заново попадает в /_assets/ и
    # отдаётся оттуда со всеми его заголовками (CORS, кэш). Нет и такого файла —
    # честный 404, но уже С CORS: без него браузер на чужом хостинге показывал
    # не 404, а «blocked by CORS policy», и разбирать это было не по чему.
    location @stale_asset {
        # ⚠️ Регулярка В КАВЫЧКАХ: без них nginx принимает `{12}` за начало блока
        # и отказывается стартовать (поймано `nginx -t` до выката).
        rewrite "^(/_assets/.+)\.[a-f0-9]{12}(\.[a-z0-9]+)$" $1$2 last;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        return 404;
    }

    location ~* ^/w(\d+)(/(?:assets|_assets)/.*)$ {
        set $worker $1;
        set $worker_port 3001;

        if ($worker = "0") { set $worker_port 3001; }
        if ($worker = "1") { set $worker_port 3002; }
        if ($worker = "2") { set $worker_port 3003; }
        if ($worker = "3") { set $worker_port 3004; }
        if ($worker = "4") { set $worker_port 3005; }
        if ($worker = "5") { set $worker_port 3006; }
        if ($worker = "6") { set $worker_port 3007; }
        if ($worker = "7") { set $worker_port 3008; }
        if ($worker = "8") { set $worker_port 3009; }
        if ($worker = "9") { set $worker_port 3010; }
        if ($worker = "10") { set $worker_port 3011; }
        if ($worker = "11") { set $worker_port 3012; }
        if ($worker = "12") { set $worker_port 3013; }
        if ($worker = "13") { set $worker_port 3014; }
        if ($worker = "14") { set $worker_port 3015; }
        if ($worker = "15") { set $worker_port 3016; }
        if ($worker = "16") { set $worker_port 3017; }
        if ($worker = "17") { set $worker_port 3018; }
        if ($worker = "18") { set $worker_port 3019; }
        if ($worker = "19") { set $worker_port 3020; }
        if ($worker = "20") { set $worker_port 3021; }
        if ($worker = "21") { set $worker_port 3022; }
        if ($worker = "22") { set $worker_port 3023; }
        if ($worker = "23") { set $worker_port 3024; }
        if ($worker = "24") { set $worker_port 3025; }
        if ($worker = "25") { set $worker_port 3026; }
        if ($worker = "26") { set $worker_port 3027; }
        if ($worker = "27") { set $worker_port 3028; }
        if ($worker = "28") { set $worker_port 3029; }
        if ($worker = "29") { set $worker_port 3030; }
        if ($worker = "30") { set $worker_port 3031; }
        if ($worker = "31") { set $worker_port 3032; }
        if ($worker = "32") { set $worker_port 3033; }
        if ($worker = "33") { set $worker_port 3034; }
        if ($worker = "34") { set $worker_port 3035; }
        if ($worker = "35") { set $worker_port 3036; }
        if ($worker = "36") { set $worker_port 3037; }
        if ($worker = "37") { set $worker_port 3038; }
        if ($worker = "38") { set $worker_port 3039; }
        if ($worker = "39") { set $worker_port 3040; }
        if ($worker = "40") { set $worker_port 3041; }

        proxy_pass http://127.0.0.1:$worker_port$2$is_args$args;
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Worker locations - Processing this first so worker-specific requests are handled by workers
    # This prevents static file regexes from capturing worker requests
    location ~* ^/w(\d+)(/.*)?$ {
        set $worker $1;
        set $worker_port 3001;
        
        if ($worker = "0") { set $worker_port 3001; }
        if ($worker = "1") { set $worker_port 3002; }
        if ($worker = "2") { set $worker_port 3003; }
        if ($worker = "3") { set $worker_port 3004; }
        if ($worker = "4") { set $worker_port 3005; }
        if ($worker = "5") { set $worker_port 3006; }
        if ($worker = "6") { set $worker_port 3007; }
        if ($worker = "7") { set $worker_port 3008; }
        if ($worker = "8") { set $worker_port 3009; }
        if ($worker = "9") { set $worker_port 3010; }
        if ($worker = "10") { set $worker_port 3011; }
        if ($worker = "11") { set $worker_port 3012; }
        if ($worker = "12") { set $worker_port 3013; }
        if ($worker = "13") { set $worker_port 3014; }
        if ($worker = "14") { set $worker_port 3015; }
        if ($worker = "15") { set $worker_port 3016; }
        if ($worker = "16") { set $worker_port 3017; }
        if ($worker = "17") { set $worker_port 3018; }
        if ($worker = "18") { set $worker_port 3019; }
        if ($worker = "19") { set $worker_port 3020; }
        if ($worker = "20") { set $worker_port 3021; }
        if ($worker = "21") { set $worker_port 3022; }
        if ($worker = "22") { set $worker_port 3023; }
        if ($worker = "23") { set $worker_port 3024; }
        if ($worker = "24") { set $worker_port 3025; }
        if ($worker = "25") { set $worker_port 3026; }
        if ($worker = "26") { set $worker_port 3027; }
        if ($worker = "27") { set $worker_port 3028; }
        if ($worker = "28") { set $worker_port 3029; }
        if ($worker = "29") { set $worker_port 3030; }
        if ($worker = "30") { set $worker_port 3031; }
        if ($worker = "31") { set $worker_port 3032; }
        if ($worker = "32") { set $worker_port 3033; }
        if ($worker = "33") { set $worker_port 3034; }
        if ($worker = "34") { set $worker_port 3035; }
        if ($worker = "35") { set $worker_port 3036; }
        if ($worker = "36") { set $worker_port 3037; }
        if ($worker = "37") { set $worker_port 3038; }
        if ($worker = "38") { set $worker_port 3039; }
        if ($worker = "39") { set $worker_port 3040; }
        if ($worker = "40") { set $worker_port 3041; }
        
        # terron 30.08: CORS для HTTP-ручек игрового сервера. Бандл на чужом
        # хостинге (Playgama) перед входом в матч спрашивает
        # `/wN/api/game/<id>/exists` — без заголовка браузер режет ответ, и вход
        # рушится ещё до соединения (поймано живой проверкой бандла).
        # ⚠️ Вебсокетам CORS не нужен вовсе — это только про HTTP.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        # ⚠️ ALLOW-HEADERS ОБЯЗАТЕЛЕН, и это стоило зависшего входа в матч у них
        # в QA-инструменте: клиент слал Content-Type на GET /exists, браузер из-за
        # этого делал preflight, а мы на него не отвечали ничем — «Request header
        # field content-type is not allowed». Клиент лишний заголовок больше не
        # шлёт, но заголовок здесь — второй рубеж: следующий такой запрос не
        # должен снова ронять вход.
        # ⚠️ Authorization обязателен: create_game шлёт Bearer-токен, и без него
        # preflight резал создание лобби с площадки («Request header field
        # authorization is not allowed», репорт владельца 31.08).
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        # Preserve query string by appending $is_args$args
        proxy_pass http://127.0.0.1:$worker_port$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # terron: чистый адрес игры /game/<id> (без /w0 и ?live). Отдаёт воркер —
    # там живёт GamePreviewRoute (OG-мета + живые игры + фолбэк на архив/реплей).
    # У нас 1 воркер (порт 3001). При масштабировании тут нужен хеш gameID%N
    # (nginx так не умеет — отдельный резолвер; см. BACKLOG).
    location ~* ^/game/[^/]+/?$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file handling with proper MIME types and consistent caching
    # terron 07.09: CORS для юридических документов. Модалка соглашения/политики
    # ЗАБИРАЕТ их фетчем (один источник правды с /privacy и /terms), а билд для
    # дистрибуции лежит на хостинге GamePush — то есть запрос кросс-доменный.
    # Без этого заголовка модалка показывала «Не удалось загрузить документ»
    # (замечание модерации Яндекса 07.09). Документы публичные и без кук.
    #
    # ⚠️ ДВА УСЛОВИЯ, ОБА ОБЯЗАТЕЛЬНЫ. (1) Caddy делает ВНУТРЕННИЙ rewrite
    # `/terms` → `/terms-of-service.html`, поэтому nginx видит уже .html — ловим
    # оба написания. (2) Локация стоит ВЫШЕ `location ~* \.html$`: у регулярных
    # локаций выигрывает ПЕРВАЯ подходящая по порядку в файле, и снизу html-правило
    # перехватывало запрос вместе с заголовками (поймано живой проверкой).
    # terron 25.09: + /graphics-help — гайд, который окно сбоя графики открывает
    # той же модалкой (LegalModal, doc "graphics").
    location ~* ^/(terms|privacy|terms-of-service\.html|privacy-policy\.html|graphics-help|graphics-help\.html)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        
        # Include MIME types
        include /etc/nginx/mime.types;
        
        # Cache configuration for static files
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;  # Cache successful responses for 24 hours
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        
        # Show cache status in response headers
        add_header X-Cache-Status $upstream_cache_status;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Default cache policy for static files
        add_header Cache-Control "public, max-age=86400";  # 24 hours
    }
    
    # /api/health endpoint - No caching, always hit the backend
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cache configuration - No caching for health checks
        proxy_cache off;
        add_header X-Cache-Status "BYPASS";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # /commit.txt endpoint - Cache for 5 seconds
    location = /commit.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Cache configuration
        proxy_cache API_CACHE;
        proxy_cache_valid 200 5s;  # Cache successful responses for 5 seconds
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Binary files caching
    location ~* \.(bin|dat|exe|dll|so|dylib)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";  # 1 year for binary files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Specific file type caching rules (outside the /static/ location)
    location ~* \.js$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Content-Type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";  # 1 year for JS files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location ~* \.css$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Content-Type text/css;
        add_header Cache-Control "public, max-age=31536000, immutable";  # 1 year for CSS files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Updated HTML file caching - 1 second cache
    location ~* \.html$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Content-Type text/html;
        add_header Cache-Control "public, max-age=1";  # 1 second for HTML files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 1s;  # Cache successful responses for 1 second
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Root location with short shared cache for the app shell
    location = / {
        proxy_pass http://127.0.0.1:3000;

        # Cache the shared app shell briefly at the proxy; browser/CDN policy
        # comes from the upstream Cache-Control header.
        proxy_cache STATIC;
        proxy_cache_valid 200 302 300s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        # terron: РФ-краулеры соцсетей минуют кеш (не читают и не пишут его), чтобы
        # бэкенд отдал им русский OG. Все прочие — как обычно из общего кеша.
        proxy_cache_bypass $og_ru_crawler;
        proxy_no_cache $og_ru_crawler;
        
        # Show cache status in response headers
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Default location for all other requests
    # terron 30.08: CORS для ручек мастера, которые читает бандл на ЧУЖОМ хостинге
    # (Playgama и подобные): /api/version — рубильник выключенных ульт.
    # ⚠️ Держим ОТДЕЛЬНОЙ локацией, а не вешаем на `location /`: там же живёт
    # SPA-оболочка и вебсокет, и звёздочка на всём подряд — лишняя поверхность.
    # Данные здесь публичные и без кук, поэтому `*` безопасен (в отличие от
    # api.terron.io, где сессионная кука и нужен точный origin).
    location ^~ /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        # ⚠️ Authorization обязателен: create_game шлёт Bearer-токен, и без него
        # preflight резал создание лобби с площадки («Request header field
        # authorization is not allowed», репорт владельца 31.08).
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
}

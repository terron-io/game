<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- terron 04.09: ХРАНИЛИЩЕ БРАУЗЕРА МОЖЕТ БЫТЬ ЗАПРЕЩЕНО ЦЕЛИКОМ.
         В чужом iframe при заблокированных сторонних данных (Safari/Chrome с
         «блокировать сторонние куки», часть площадок) сам ДОСТУП к
         window.localStorage бросает SecurityError. Клиент читает настройки в
         конструкторах компонентов (UserSettings, LangSelector, кэш API) — то есть
         страница умирала на загрузке: за 3 дня ~20 сессий с «Access is denied for
         this document» в пяти разных местах, и все они — игрок без игры.
         Оборачивать 280 обращений по одному — вечная погоня за следующим. Один
         рубеж здесь: если хранилище недоступно, подставляем хранилище В ПАМЯТИ
         (живёт до перезагрузки). Настройки не сохранятся между заходами, но игра
         работает. Обычному браузеру этот скрипт ничего не меняет. -->
    <script>
      (function () {
        function mem() {
          var m = new Map();
          return {
            get length() {
              return m.size;
            },
            key: function (i) {
              var k = Array.from(m.keys())[i];
              return k === undefined ? null : k;
            },
            getItem: function (k) {
              k = String(k);
              return m.has(k) ? m.get(k) : null;
            },
            setItem: function (k, v) {
              m.set(String(k), String(v));
            },
            removeItem: function (k) {
              m.delete(String(k));
            },
            clear: function () {
              m.clear();
            },
          };
        }
        ["localStorage", "sessionStorage"].forEach(function (name) {
          var ok = false;
          try {
            var s = window[name];
            ok =
              s !== null && s !== undefined && typeof s.getItem === "function";
          } catch (e) {}
          if (ok) return;
          try {
            Object.defineProperty(window, name, {
              value: mem(),
              configurable: true,
              writable: false,
            });
            // Читает Health.ts → датчик storage_denied (сколько таких сессий).
            window.__terronMemStorage =
              (window.__terronMemStorage || "") + name + " ";
          } catch (e) {}
        });
      })();
    </script>
    <!-- terron: игра во iframe площадки-стора (Яндекс Игры / VK / Пикабу / GamePush)?
         Ставим html.gp-embed СИНХРОННО, до рендера — CSS-косметика стора (скрытый
         промо приложения и т.п.) применяется без мигания. cross-origin top кинет →
         это тоже чужой iframe. На terron.io / нативном приложении — self===top, класс
         не ставится. -->
    <script>
      (function () {
        try {
          // ?embed=1 — форс gp-embed для ТЕСТА раскладки стора из обычного браузера
          // (в обычной вкладке self===top, поэтому иначе не проверить).
          var forced = /[?&]embed=1\b/.test(window.location.search);
          // terron 02.09: ПЛОЩАДКА МОЖЕТ ОТКРЫТЬ НАС ВЕРХНИМ ДОКУМЕНТОМ, БЕЗ IFRAME.
          //
          // Мобильные приложения ВК и Одноклассников грузят игру прямо в свой
          // WebView: iframe там нет вовсе, self === top. Пока признаком площадки
          // был ОДИН только iframe, с телефона разом отваливалось всё: SDK не
          // грузился (значит ни автовхода, ни рекламы — прямая претензия модерации
          // ОК «в игре нет рекламы») и не применялись запреты площадки (видимые
          // внешние ссылки — претензия Яндекса). Доказано логами 02.09: заход из
          // приложения ВК пришёл с referrer «terron.io/?vk_access_token_settings=…»,
          // то есть параметры запуска лежали в НАШЕМ адресе, а не у родителя.
          //
          // Поэтому второй признак — параметры запуска площадки в адресе. Их ставит
          // сама площадка: ВК шлёт vk_app_id/vk_user_id, Одноклассники —
          // api_server/application_key/logged_user_id.
          //
          // terron 03.09: ТРЕТИЙ ПРИЗНАК — НАША ССЫЛКА ДЛЯ ПЛОЩАДОК `?gp=1`.
          // Модерация Яндекса (через GamePush) отклонила интеграцию по ссылке за
          // «уводящие ссылки на главной»: модератор открывает ссылку ПРЯМО, в
          // обычной вкладке — ни iframe, ни параметров запуска там нет, и сайт
          // честно показывает себя сайтом (телега, сторы, «скачать»). Под
          // gp-embed видимых внешних ссылок 0 — проверено на боевом. Поэтому
          // площадкам отдаём ссылку с маркером: он включает режим площадки
          // (и SDK GamePush) даже верхним документом. Обычный terron.io не задет.
          var launched =
            /[?&](vk_app_id|vk_user_id|api_server|application_key|logged_user_id|gp)=/.test(
              window.location.search,
            );
          // ⚠️ ЗАПОМИНАЕМ НА ВКЛАДКУ: адресную строку чистит наш роутер, а любая
          // последующая навигация внутри игры уносит параметры вместе с признаком
          // площадки — и вторая загрузка снова считала бы себя обычным сайтом.
          try {
            if (launched) sessionStorage.setItem("terron_platform_launch", "1");
            else if (sessionStorage.getItem("terron_platform_launch") === "1")
              launched = true;
          } catch (e) {}
          // Читает клиент (GamePushSDK.isOnPlatform) — один источник правды на
          // страницу, второй детект разъехался бы с этим.
          window.__platformLaunch = launched;
          if (forced || launched || window.self !== window.top)
            document.documentElement.classList.add("gp-embed");
          // itch.io: раскладку под iframe (кроп HUD, компактный верх) оставляем —
          // плеер itch такой же жёсткий 1280×720. А вот ЗАПРЕТЫ ПЛОЩАДКИ (скрытые
          // внешние ссылки, убранная «Пропаганда») там ни при чём — снимаем их
          // отдельным классом, см. terron-theme.css.
          if (/[?&]embed=itch\b/.test(window.location.search))
            document.documentElement.classList.add("itch-embed");
        } catch (e) {
          document.documentElement.classList.add("gp-embed");
        }
      })();
    </script>
    <!-- terron 02.09: ГЛАВНАЯ ПОКАЗЫВАЕТСЯ ЕДИНЫМ БЛОКОМ, А НЕ ПО ЧАСТЯМ.
         Требование владельца после шести скринов с телефона: словарь, флаг, превью
         карты доезжают по очереди, и первые секунды меню стоит сырыми ключами с
         битыми картинками. Ставим html.boot-pending СИНХРОННО (до первого кадра):
         CSS прячет main-layout и рисует плашку «ЗАГРУЗКА». Снимаем, когда пришёл
         словарь (событие terron-lang-loaded из LangSelector) И страница догрузила
         ассеты первого экрана (window load), — либо по потолку 6 с, чтобы мёртвая
         сеть не оставила игрока перед пустым экраном навсегда. Матч (body.in-game)
         снимает сразу — там свой оверлей загрузки карты. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.classList.add("boot-pending");
          var done = false;
          var langReady = false;
          var release = function () {
            if (done) return;
            done = true;
            root.classList.remove("boot-pending");
          };
          var maybe = function () {
            if (!langReady) return;
            if (document.readyState === "complete") release();
            else setTimeout(release, 1500); // ассеты первого экрана ещё едут — недолго
          };
          window.addEventListener("terron-lang-loaded", function () {
            langReady = true;
            maybe();
          });
          window.addEventListener("load", maybe);
          setTimeout(release, 6000); // потолок: сеть мертва — показываем что есть
          // Матч стартовал (адрес /game/…) — оверлей главной не нужен вовсе.
          new MutationObserver(function () {
            if (document.body && document.body.classList.contains("in-game")) release();
          }).observe(root, { attributes: true, subtree: true, attributeFilter: ["class"] });
        } catch (e) {
          try { document.documentElement.classList.remove("boot-pending"); } catch (_) {}
        }
      })();
    </script>
    <!-- terron: gp-embed — площадка может показывать НЕ ВЕСЬ наш iframe (песочница
         GamePush: пресет ставит iframe жёстко 1280×720, контейнер overflow:hidden →
         при невысоком окне низ кадра отрезан ВМЕСТЕ с нижним HUD). Изнутри iframe
         кроп невидим обычными средствами, но IntersectionObserver отдаёт видимый
         прямоугольник ДАЖЕ в кросс-доменном iframe (координаты — в нашей системе).
         Меряем сентинел на весь вьюпорт → сколько низа/верха скрыто → CSS-переменные
         --gp-crop-b / --gp-crop-t на <html>. Нижний HUD поднимается на --gp-crop-b
         (transform-хук контейнера, тот же что --kb-inset). Вне embed скрипт молчит. -->
    <script>
      (function () {
        if (!document.documentElement.classList.contains("gp-embed")) return;
        if (typeof IntersectionObserver !== "function") return;
        var apply = function (b, t) {
          var s = document.documentElement.style;
          s.setProperty("--gp-crop-b", (b | 0) + "px");
          s.setProperty("--gp-crop-t", (t | 0) + "px");
        };
        // шаг 1% → точность ~7px на 720p; мельче не надо (дрожь гоняет стили)
        var thresholds = [];
        for (var i = 0; i <= 100; i++) thresholds.push(i / 100);
        var onIO = function (entries) {
          var e = entries[entries.length - 1];
          var r = e.intersectionRect;
          var cropB = 0;
          var cropT = 0;
          if (e.isIntersecting && r && r.height > 0) {
            cropB = Math.max(0, window.innerHeight - r.bottom);
            cropT = Math.max(0, r.top);
          }
          // <8px — скругления/скроллбар-дрожь, не двигаем
          apply(cropB < 8 ? 0 : cropB, cropT < 8 ? 0 : cropT);
        };
        var boot = function () {
          var sentinel = document.createElement("div");
          sentinel.style.cssText =
            "position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;visibility:hidden;z-index:-1;";
          document.body.appendChild(sentinel);
          var io = new IntersectionObserver(onIO, { threshold: thresholds });
          io.observe(sentinel);
          // resize нашего вьюпорта: сентинел fixed на inset:0 меняется вместе с ним,
          // но переподписка форсит немедленный пересчёт (IO иначе может промолчать,
          // если ratio не пересёк порог).
          window.addEventListener("resize", function () {
            io.unobserve(sentinel);
            io.observe(sentinel);
          });
        };
        if (document.body) boot();
        else document.addEventListener("DOMContentLoaded", boot);
      })();
    </script>
    <!-- terron: RU-THROTTLE PROBES — вырезается в платформенных сборках -->
    <!-- terron: бикон загрузки — ловим «сорвался на входе» (первый ответ HTML
         прошёл, но остатки сайта не докачались: DPI-throttle, из-за которого
         часть РФ не заходит без VPN). Летит ПРЯМО СЕЙЧАС, на первых байтах HTML
         (знаменатель). Парный ready-бикон стреляет с ВЕРХА основного бандла (когда
         JS-нагрузка доехала) — если бандл придушили, ready не придёт и сессия =
         дроп «первый пакет прошёл, дальше обрыв». Разбор: /admin/ru-ban. -->
    <script>
      (function () {
        try {
          var s = sessionStorage.getItem("t_lb_sid");
          if (!s) {
            s =
              Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            sessionStorage.setItem("t_lb_sid", s);
          }
          window.__tLbSid = s;
          new Image().src =
            "/api/lb?s=" + encodeURIComponent(s) + "&e=boot&t=" + Date.now();
        } catch (e) {}
      })();
    </script>
    <!-- terron: двухуровневый зонд полосы — ЧИСТЫЙ детект РФ-throttle. Сразу (не
         ждём бандл) тянем два несжимаемых файла с того же origin (тот же SNI →
         тот же DPI-throttle): small ~4КБ просачивается сквозь замедление, large
         ~256КБ под throttle (≤5КБ/с) не докачивается за grace, а реальный медленный
         инет (3G ~50КБ/с) успевает за секунды. Блок = small ✅ & large ❌. Отсекает
         медленный интернет И «человек закрыл вкладку». Разбор: /admin/ru-ban. -->
    <script>
      (function () {
        try {
          var s = window.__tLbSid;
          if (!s || typeof fetch !== "function") return;
          var beacon = function (stage, ms) {
            try {
              new Image().src =
                "/api/lb?s=" +
                encodeURIComponent(s) +
                "&e=" +
                stage +
                "&d=" +
                (ms | 0) +
                "&t=" +
                Date.now();
            } catch (e) {}
          };
          var probe = function (kb, stage) {
            var t0 = Date.now();
            var opts = { cache: "no-store" };
            try {
              var ctl = new AbortController();
              opts.signal = ctl.signal;
              setTimeout(function () {
                try {
                  ctl.abort();
                } catch (e) {}
              }, 30000);
            } catch (e) {}
            // ?r= уникальный на каждую загрузку → обход любого кеша.
            fetch("/api/lbprobe?sz=" + kb + "&r=" + s + Date.now(), opts)
              .then(function (r) {
                return r.arrayBuffer();
              })
              .then(function () {
                beacon(stage, Date.now() - t0);
              })
              .catch(function () {
                /* throttle/timeout/уход → бикон не летит → settled=throttled */
              });
          };
          probe(4, "probe_small");
          probe(256, "probe_large");
        } catch (e) {}
      })();
    </script>
    <!-- /terron: RU-THROTTLE PROBES -->
    <!-- terron: переключатель окружения prod/dev. Тумблер в футере пишет
         localStorage.terron_env; этот скрипт применяет выбор ДО старта
         приложения (редирект на нужный хост). Нужно для Android-приложения
         (грузит terron.io, но можно увести на dev.terron.io). Только при
         явном несовпадении выбора и хоста — обычных юзеров не трогает. -->
    <script>
      // terron: одноразовая чистка старого флага переключателя окружений
      // (раньше он вызывал залипающий редирект на разных origin). Сейчас
      // переключалка просто переходит на другой хост, без форс-редиректа.
      (function () {
        try {
          localStorage.removeItem("terron_env");
        } catch (e) {}
      })();
    </script>
    <!-- terron: ОФЛАЙН-ГИБРИД (Apple 4.2). Онлайн = ЖИВОЙ сайт (актуальная игра),
         офлайн = ЛОКАЛЬНЫЙ бандл (сингл + вшитые карты). Переход:
           • онлайн→офлайн = АВТО (связь пропала → уходим в бандл);
           • офлайн→онлайн = ПОП-АП (связь вернулась → спрашиваем, грузить ли живую).
         На вебе/деве — no-op (isNative=false). См. OFFLINE-IOS.md. -->
    <script>
      (function () {
        var cap = window.Capacitor;
        var isNative = !!(
          cap &&
          cap.isNativePlatform &&
          cap.isNativePlatform()
        );
        if (!isNative) return; // веб/дев — no-op

        var LIVE = "https://terron.io/";
        // terron: бандл-цель ПО ПЛАТФОРМЕ (не по текущему протоколу — на terron.io он
        // https и дал бы неверную цель). iOS = capacitor://localhost (iosScheme:capacitor,
        // кастомная схема перехватывается → достижима офлайн даже рантайм-редиректом с
        // terron.io; https://localhost офлайн НЕ грузился). Android = https://localhost.
        var plat = cap && cap.getPlatform && cap.getPlatform();
        var BUNDLE =
          plat === "ios" ? "capacitor://localhost/" : "https://localhost/";
        // terron 21.08: МАРКЕР АПКИ ДЛЯ АНАЛИТИКИ. На origin terron.io мост
        // Capacitor может не инжектиться (флапает в WKWebView), поэтому «я из
        // апки» передаём единственным, что переживает смену origin, — query.
        // Клиент (Analytics.clientPlatform) приклеит его в localStorage апки.
        // ⚠️ ТОЛЬКО в адресе перехода: LIVE участвует в склейке URL пинга
        // (LIVE + "commit.txt?_=") — с query там получился бы битый адрес.
        var LIVE_ENTRY =
          LIVE + "?from=" + (plat === "ios" ? "ios_app" : "android_app");
        var onLive = /(^|\.)terron\.io$/i.test(location.hostname);

        // Пинг живого сайта. no-cors → ответ opaque, но РЕЗОЛВ промиса = хост достижим
        // (нельзя доверять navigator.onLine/событиям — в WKWebView застревают).
        // cache-bust + no-store → не ложный «онлайн» из кеша.
        function pingLive(cb) {
          try {
            var ctrl = new AbortController();
            var t = setTimeout(function () {
              ctrl.abort();
            }, 2500);
            fetch(LIVE + "commit.txt?_=" + Date.now(), {
              mode: "no-cors",
              cache: "no-store",
              signal: ctrl.signal,
            })
              .then(function () {
                clearTimeout(t);
                cb(true);
              })
              .catch(function () {
                clearTimeout(t);
                cb(false);
              });
          } catch (e) {
            cb(false);
          }
        }

        // terron: НЕ дёргаем переход во время игры — авто-редирект посреди матча
        // выкинул бы из партии. Класс in-game ставит Main.ts на старте игры.
        function inGame() {
          return !!(
            document.body && document.body.classList.contains("in-game")
          );
        }

        // Один переход на загрузку страницы (после replace мы всё равно уходим).
        var done = false;

        if (!onLive) {
          // === БАНДЛ (офлайн-контекст) ===
          // Есть связь И НЕ в офлайн-игре → АВТО на живой сайт (без попапа).
          // В офлайн-игре — ждём её конца (in-game снимется → уйдём след. поллом).
          function tryGoLive() {
            if (done) return;
            pingLive(function (online) {
              if (done || !online || inGame()) return;
              done = true;
              location.replace(LIVE_ENTRY);
            });
          }
          tryGoLive(); // холодный старт
          setInterval(tryGoLive, 5000);
          // События — лишь ХИНТ для скорости (в WKWebView врут), решает pingLive.
          window.addEventListener("online", tryGoLive);
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") tryGoLive();
          });
        } else {
          // === ЖИВОЙ САЙТ (онлайн-контекст) ===
          // Связь пропала И НЕ в онлайн-игре → на офлайн-бандл (вшитые карты).
          // В игре НЕ дёргаем — пусть игра сама обработает дисконнект.
          // ВАЖНО: navigator.onLine===false — НАДЁЖНЫЙ сигнал офлайна на iPad
          // (бейдж подтвердил), в отличие от pingLive (no-cors fetch может дать
          // ложный «онлайн» из кэша WKWebView). Поэтому триггерим по нему НАПРЯМУЮ.
          function goBundle() {
            if (inGame()) return;
            location.replace(BUNDLE);
          }
          function tryGoBundle() {
            if (done) return;
            if (navigator.onLine === false) {
              done = true;
              goBundle();
              return;
            }
            pingLive(function (online) {
              if (done || online || inGame()) return;
              done = true;
              goBundle();
            });
          }
          tryGoBundle(); // сразу на загрузке (вдруг уже офлайн)
          setInterval(tryGoBundle, 3000);
          window.addEventListener("offline", tryGoBundle);
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") tryGoBundle();
          });
        }
      })();
    </script>
    <!-- terron iOS: высота наложенной клавиатуры → CSS-переменная --kb-inset.
         С overlays-content layout-viewport НЕ меняется, но visualViewport
         ужимается на высоту клавы. Нижнюю чат-панель поднимаем на --kb-inset,
         чтобы поле ввода было видно. Игра/координаты не трогаются. -->
    <script>
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        function update() {
          // Когда страница зумнута (pinch / focus-zoom), vv.height/offset врут —
          // не трогаем подъём панели, иначе её «выкидывает». При scale≈1 считаем.
          if (vv.scale && vv.scale > 1.01) return;

        vv.addEventListener("scroll", update);
        update();
      })();

    <!-- Scripts -->
    <script>
      // terron perf (Z19): показываем страницу по DOMContentLoaded (DOM+CSS
      // готовы), а НЕ по window.load — тот ждёт ВСЕ ресурсы (картинки/шрифты),
      // и на мобильной сети юзер смотрел в пустой экран до 3с.
      window.addEventListener("DOMContentLoaded", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: если DOMContentLoaded почему-то не пришёл.
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 1500);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>

    <script type="module" src="/src/client/Main.ts"></script>

    <!-- terron: GamePush SDK (Yandex Игры / VK Play / Пикабу одним SDK). Канонический
         сниппет (publicToken + callback=onGPInit, до </body>) грузим ТОЛЬКО когда игра
         встроена в iframe площадки. На прямом terron.io и в нативном приложении (не
         iframe) — НЕ грузим, интеграция инертна. gp кладём в window + резолвим промис
         __gpReady, который ждёт клиент (GamePushSDK.ts) → «раньше инициализации» к СДК
         больше не обращаемся. Точный порядок: onGPInit(gp) → await gp.player.ready. -->
    <script>
      (function () {
        try {
          // Площадка = чужой iframe ЛИБО запуск верхним документом из мобильного
          // приложения ВК/ОК (флаг ставит скрипт в <head>, см. __platformLaunch).
          if (window.self === window.top && !window.__platformLaunch) return;
          // itch.io — НЕ площадка GamePush: там свой магазин, своя (или никакая)
          // реклама и свои правила. Грузить туда чужой SDK значит крутить его
          // рекламу на чужой витрине, слать их аналитике чужие сессии и ловить
          // язык площадки, которой нет (см. isItchEmbed в Utils.ts).
          if (/[?&]embed=itch\b/.test(window.location.search)) return;
          window.__gpReady = new Promise(function (resolve) {
            window.onGPInit = function (gp) {
              window.__gp = gp;
              resolve(gp);
            };
          });
          var s = document.createElement("script");
          s.async = true;
          s.src =
            // terron 03.09: хост `gs.eponesh.com`, а не `gamepush.com` — просьба модерации
            // GamePush: домен eponesh.com в белом списке Яндекс.Игр по умолчанию,
            // gamepush.com — нет (их CSP режет чужие скрипты). Скрипт тот же.
            "https://gs.eponesh.com/sdk/game-score.js?projectId=28774&publicToken=8apF7hsZxFjWfBrsoD3cmf88O0ZPTqG4&callback=onGPInit";
          document.body.appendChild(s);
        } catch (e) {}
      })();
    </script>
  </body>

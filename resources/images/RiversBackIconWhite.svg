<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff">
  <!-- terron: ультимейты — «РЕКИ ВСПЯТЬ»: плотина с тремя водосбросами и вода
       под ней. Разблокирует водяную ракету: суша в радиусе превращается в воду
       навсегда. Силуэт держит крупные проёмы (на карте иконка ~16px, мелкие
       прорези слиплись бы в белое пятно) — тот же рисунок, что колонка 18
       icon-atlas (new-units/gen-ult-assets.py draw_rivers_back).
       Без флагов и символов, как прочие ульт-иконки. new-units/ULTIMATES.md -->

  <!-- гребень плотины -->
  <rect x="1.9" y="4.9" width="20.2" height="2.6" rx="0.4"/>

  <!-- тело плотины: трапеция с ТРЕМЯ вырезанными водосбросами (fill-rule) -->
  <path fill-rule="evenodd"
        d="M3 7.5h18l1.5 9.8H1.5Z
           M4.9 8.3h3.7l0.4 9H4.5Z
           M10.2 8.3h3.7l0.4 9h-4.1Z
           M15.5 8.3h3.7l0.4 9h-4.1Z"/>

  <!-- вода нижнего бьефа -->
  <path d="M1.2 18q2.8-2.2 5.6 0t5.6 0t5.6 0t4.8-.4v4.4H1.2Z"/>
</svg>

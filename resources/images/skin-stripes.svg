    <line x1="-256" y1="256" x2="256" y2="-256"/>
    <line x1="0" y1="512" x2="512" y2="0"/>
    <line x1="256" y1="768" x2="768" y2="256"/>
    <line x1="512" y1="1024" x2="1024" y2="512"/>
    <line x1="768" y1="1280" x2="1280" y2="768"/>
  </g>
</svg>

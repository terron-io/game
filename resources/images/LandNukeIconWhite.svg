<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff">
  <!-- terron 25.08: ТЕРРАФОРМИНГ — каст «НАСЫПЬ» (вода → суша). Остров,
       поднявшийся из моря: пологий холм с плоской вершиной и волны по бокам,
       расходящиеся от него. Обратная по смыслу иконка к «Затоплению»
       (плотина + вода снизу), поэтому вода тут ПО КРАЯМ, а не под всем
       силуэтом. Крупные формы: на карте иконка ~16px. new-units/TERRA.md -->

  <!-- поднявшийся остров: холм с плоской вершиной -->
  <path d="M4.2 15.4 8.4 8.1h7.2l4.2 7.3Z"/>

  <!-- гребень (светлая полка вершины отделена вырезом) -->
  <path d="M9.6 6.2h4.8l1.1 1.9H8.5Z"/>

  <!-- волны, расходящиеся от острова: две слева, две справа -->
  <path d="M1 17.4q1.6-1.5 3.2 0t3.2 0v1.9q-1.6-1.5-3.2 0t-3.2 0Z"/>
  <path d="M16.6 17.4q1.6-1.5 3.2 0t3.2 0v1.9q-1.6-1.5-3.2 0t-3.2 0Z"/>
  <path d="M1 20.7q2.6-1.5 5.2 0t5.4 0t5.4 0t6-.3v2.4H1Z"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#fff">
  <!-- terron: ультимейты — Религия. Абстрактный СТУПЕНЧАТЫЙ храм (зиккурат):
       широкий, приземистый — без креста/полумесяца/звезды и не «свечка». -->
  <rect x="27" y="16" width="10" height="10"/>  <!-- верхнее святилище -->
  <rect x="22" y="26" width="20" height="8"/>   <!-- ярус 3 -->
  <rect x="16" y="34" width="32" height="8"/>   <!-- ярус 2 -->
  <rect x="10" y="42" width="44" height="8"/>   <!-- ярус 1 (широкий) -->
  <rect x="6"  y="50" width="52" height="6"/>   <!-- основание -->
</svg>

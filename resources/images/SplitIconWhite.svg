<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Раскол: флаг, треснувший по зигзагу; на левой половине — буква Т -->
  <!-- левая половина флага -->
  <path d="M8 10 H34 L29 20 L36 30 L28 40 L34 54 H8 Z" fill="#fff"/>
  <!-- правая половина флага, отколотая и сдвинутая -->
  <path d="M38 10 H56 V54 H40 L34 40 L42 30 L35 20 Z" fill="#fff" opacity="0.55"/>
  <!-- буква Т на левой половине (вырез) -->
  <path d="M12 16 H30 V21 H24 V38 H18 V21 H12 Z" fill="#111"/>
  <!-- древко -->
  <rect x="4" y="8" width="3" height="50" rx="1.5" fill="#fff"/>
</svg>

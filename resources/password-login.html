<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TERRON.io — Вход</title>
    <style>
      :root {
        --bg: #11140f;
        --card: #f5f1e6;
        --ink: #1a1a1a;
        --accent: #2b2a24;
        --line: rgba(0, 0, 0, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
        padding: 30px 28px 26px;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 22px;
        text-align: center;
        margin: 0 0 4px;
      }
      .sub {
        text-align: center;
        opacity: 0.6;
        font-size: 13px;
        margin: 0 0 22px;
      }
      label {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.65;
        margin: 14px 0 5px;
      }
      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-size: 15px;
        border-radius: 0;
      }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 13px;
        border: none;
        background: var(--accent);
        color: var(--card);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .msg {
        margin-top: 14px;
        font-size: 13px;
        min-height: 18px;
        text-align: center;
      }
      .msg.err {
        color: #c0392b;
      }
      .msg.ok {
        color: #2e7d32;
      }
    </style>
  </head>
  <body>
    <form class="card" id="f" autocomplete="on">
      <div class="brand">TERRON.io</div>
      <div class="sub">Вход по логину и паролю</div>

      <label for="email">Логин (email)</label>
      <input id="email" name="email" type="email" autocomplete="username" required />

      <label for="password">Пароль</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />

      <button id="btn" type="submit">Войти</button>
      <div class="msg" id="msg"></div>
    </form>

    <script>
      // API на отдельном поддомене; cookie сессии общий для .terron.io.
      var API = "https://api.terron.io";
      var f = document.getElementById("f");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn");
      f.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.className = "msg";
        msg.textContent = "";
        btn.disabled = true;
        fetch(API + "/auth/login/password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value.trim(),
          }),
        })
          .then(function (r) {
            return r.ok
              ? r.json().then(function () {
                  msg.className = "msg ok";
                  msg.textContent = "Готово, входим…";
                  location.href = "https://terron.io/";
                })
              : r
                  .json()
                  .catch(function () {
                    return {};
                  })
                  .then(function () {
                    throw new Error(
                      r.status === 401
                        ? "Неверный логин или пароль"
                        : "Ошибка входа",
                    );
                  });
          })
          .catch(function (err) {
            msg.className = "msg err";
            msg.textContent = err.message || "Ошибка сети";
            btn.disabled = false;
          });
      });
    </script>
  </body>
</html>
